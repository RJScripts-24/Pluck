spring.application.name=pluck-backend
server.port=4000

# MongoDB Connection (from environment or local default)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/pluck}
spring.data.mongodb.auto-index-creation=false

# Serve frontend static assets from ../frontend
spring.web.resources.static-locations=file:../frontend/,classpath:/static/

# Pluck Security & JWT Settings
pluck.jwt.secret=${JWT_SECRET:pluck_super_secure_jwt_secret_key_at_least_256_bits_long_1234567890}
pluck.jwt.expiration-seconds=2592000
